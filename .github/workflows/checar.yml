name: Checar

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx vite build
      # teste de fumaça da interface: login fingido, abre o escritório e pede um post
      - run: npx playwright-core install --with-deps chromium
      - run: npm run fumaca
