    <style>
      /* abertura: a mesma tela do HTML puro (antes do app carregar) e do React (sessão e escritório) */
      .abertura { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: #faf9f5; color: #1f2330; font-family: Inter, system-ui, sans-serif }
      .abertura.no-palco { position: absolute; z-index: 1 }
      .ab-miolo { display: flex; flex-direction: column; align-items: center; gap: 18px; animation: ab-entra .4s ease-out both }
      .ab-cena { position: relative; width: 96px; height: 104px; display: grid; justify-items: center }
      .ab-robo { width: 76px; height: 76px; image-rendering: pixelated; animation: ab-pula 1.2s steps(6) infinite }
      .ab-robo .olho { transform-box: fill-box; transform-origin: center; animation: ab-pisca 3.2s steps(1) infinite }
      .ab-sombra { position: absolute; bottom: 4px; width: 52px; height: 8px; border-radius: 50%; background: rgba(31,35,48,.14); animation: ab-sombra 1.2s steps(6) infinite }
      .ab-titulo { margin: 0; font-family: 'Pixelify Sans', monospace; font-size: 20px; font-weight: 700; letter-spacing: .01em }
      .ab-barra { display: flex; gap: 4px; padding: 4px; border: 2px solid #1f2330; background: #fff; box-shadow: 3px 3px 0 rgba(31,35,48,.18) }
      .ab-barra i { width: 10px; height: 10px; background: #e3ddd0; animation: ab-bloco 1.6s steps(1) infinite }
      .ab-barra i:nth-child(2) { animation-delay: .16s } .ab-barra i:nth-child(3) { animation-delay: .32s } .ab-barra i:nth-child(4) { animation-delay: .48s }
      .ab-barra i:nth-child(5) { animation-delay: .64s } .ab-barra i:nth-child(6) { animation-delay: .8s } .ab-barra i:nth-child(7) { animation-delay: .96s } .ab-barra i:nth-child(8) { animation-delay: 1.12s }
      .ab-frase { position: relative; height: 20px; width: 260px; margin: 0; font-size: 13px; color: #6b6d66; text-align: center }
      .ab-frase span { position: absolute; inset: 0; opacity: 0; animation: ab-frase 8s infinite }
      .ab-frase span:nth-child(2) { animation-delay: 2s } .ab-frase span:nth-child(3) { animation-delay: 4s } .ab-frase span:nth-child(4) { animation-delay: 6s }
      .ab-frase.fixa span { opacity: 1; animation: none }
      @keyframes ab-entra { from { opacity: 0; transform: translateY(6px) } }
      @keyframes ab-pula { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }
      @keyframes ab-sombra { 0%, 100% { transform: scaleX(1); opacity: 1 } 50% { transform: scaleX(.7); opacity: .6 } }
      @keyframes ab-pisca { 0%, 92%, 100% { transform: scaleY(1) } 94% { transform: scaleY(.15) } }
      @keyframes ab-bloco { 0% { background: #2a5288 } 50%, 100% { background: #e3ddd0 } }
      @keyframes ab-frase { 0% { opacity: 0; transform: translateY(4px) } 5%, 22% { opacity: 1; transform: none } 27%, 100% { opacity: 0; transform: translateY(-4px) } }
      @media (prefers-reduced-motion: reduce) { .ab-robo, .ab-sombra, .ab-robo .olho, .ab-barra i { animation: none } .ab-frase span { animation: none } .ab-frase span:first-child { opacity: 1 } }
    </style>
    <title>Escritório de Agentes</title>
  </head>
  <body>
    <div id="root"><div class="abertura" role="status" aria-label="Abrindo o escritório"><div class="ab-miolo"><div class="ab-cena"><svg class="ab-robo" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#1E3D66"/><g transform="translate(96 104) scale(3.2)"><rect x="39" y="0" width="22" height="22" rx="6" fill="#FAF5EB"/><rect x="5" y="28" width="90" height="72" rx="18" fill="#FAF5EB"/><g fill="#1E3D66"><rect class="olho" x="25" y="52" width="17" height="20" rx="5"/><rect class="olho" x="58" y="52" width="17" height="20" rx="5"/></g></g></svg><div class="ab-sombra"></div></div><p class="ab-titulo">Escritório de Agentes</p><div class="ab-barra" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><p class="ab-frase"><span>Acendendo as luzes…</span><span>Ligando os monitores…</span><span>Chamando a equipe…</span><span>Passando o café…</span></p></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
